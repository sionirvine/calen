name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libvulkan-dev
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: cargo-sources.json matches Cargo.lock
        run: |
          python3 -m venv /tmp/venv && /tmp/venv/bin/pip install --quiet aiohttp tomlkit
          curl -sSfL -o /tmp/flatpak-cargo-generator.py \
            https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/9d86d336a39b9af38b86f114b6ce5820fe260f91/cargo/flatpak-cargo-generator.py
          /tmp/venv/bin/python /tmp/flatpak-cargo-generator.py Cargo.lock -o /tmp/cargo-sources.json
          diff -q /tmp/cargo-sources.json packaging/flatpak/cargo-sources.json \
            || { echo "::error::Regenerate packaging/flatpak/cargo-sources.json (see README)"; exit 1; }
      - name: Lint manifest and metainfo
        run: |
          flatpak-builder-lint manifest packaging/flatpak/com.felixadr.Calen.yml
          flatpak-builder-lint appstream packaging/linux/com.felixadr.Calen.metainfo.xml
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: Calen-x86_64.flatpak
          manifest-path: packaging/flatpak/com.felixadr.Calen.yml
          cache-key: flatpak-builder-${{ hashFiles('Cargo.lock') }}
          upload-artifact: false
